<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Industrial Charcoal & Amber) -->
    <linearGradient id="bgSlave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18130A" />
      <stop offset="45%" stop-color="#161F20" />
      <stop offset="100%" stop-color="#0A0F14" />
    </linearGradient>

    <!-- Radial Center Glow (Amber & Emerald) -->
    <radialGradient id="centerGlowSlave" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Industrial Amber Accent Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- RTU Metal Enclosure Gradient -->
    <linearGradient id="rtuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2A3A" />
      <stop offset="50%" stop-color="#15212E" />
      <stop offset="100%" stop-color="#0D1622" />
    </linearGradient>

    <!-- Terminal Pin Brass Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Oscilloscope Screen Gradient -->
    <linearGradient id="scopeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051C15" />
      <stop offset="100%" stop-color="#020E0A" />
    </linearGradient>

    <filter id="shadowSlave" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgSlave)" />

  <!-- Industrial Grid Pattern -->
  <g stroke="#F59E0B" stroke-width="1" stroke-opacity="0.07">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" stroke-opacity="0.14" stroke-dasharray="6 4" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" stroke-opacity="0.14" stroke-dasharray="6 4" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Ambient Light Sphere -->
  <rect width="512" height="512" rx="116" fill="url(#centerGlowSlave)" />

  <!-- Outer Squircle Bezel Border -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#amberGrad)" stroke-width="3" stroke-opacity="0.45" />

  <!-- Protocol Header Badge -->
  <g transform="translate(256, 68)">
    <rect x="-88" y="-14" width="176" height="28" rx="14" fill="#2E1C0A" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="-66" cy="0" r="4" fill="#FBBF24" />
    <text x="7" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FCD34D" letter-spacing="2" text-anchor="middle">IEC 60870-5-104</text>
  </g>

  <!-- Main Illustration Group -->
  <g filter="url(#shadowSlave)" transform="translate(0, -6)">
    <!-- Substation High-Voltage Pylon Lattice Silhouette (Behind RTU) -->
    <g stroke="#D97706" stroke-width="2.5" stroke-opacity="0.45" stroke-linecap="round">
      <!-- Pylon Mast Top Lightning Rod -->
      <line x1="256" y1="105" x2="256" y2="145" stroke-width="3.5" stroke-opacity="0.8" />
      <circle cx="256" cy="105" r="3.5" fill="#F59E0B" />
      <!-- Upper Crossarm -->
      <line x1="190" y1="145" x2="322" y2="145" stroke-width="3" />
      <!-- Insulator Strings with Spark Glyphs -->
      <line x1="200" y1="145" x2="200" y2="168" stroke-width="2.5" stroke-dasharray="3 3" />
      <line x1="312" y1="145" x2="312" y2="168" stroke-width="2.5" stroke-dasharray="3 3" />
      <circle cx="200" cy="172" r="3" fill="#34D399" />
      <circle cx="312" cy="172" r="3" fill="#34D399" />
      <!-- Diagonal Braces -->
      <line x1="256" y1="105" x2="200" y2="145" />
      <line x1="256" y1="105" x2="312" y2="145" />
      <line x1="210" y1="145" x2="256" y2="190" />
      <line x1="302" y1="145" x2="256" y2="190" />
    </g>

    <!-- Spontaneous Telemetry Emission Waves (COT=3 Push Wave) -->
    <path d="M 175 186 A 90 90 0 0 1 337 186" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.75" />
    <path d="M 210 196 A 50 50 0 0 1 302 196" fill="none" stroke="#FBBF24" stroke-width="4.5" stroke-linecap="round" />

    <!-- Industrial RTU Enclosure Housing -->
    <g transform="translate(256, 280)">
      <!-- Top Terminal Connection Block (Screw Terminal Pins) -->
      <g transform="translate(0, -92)">
        <rect x="-102" y="0" width="204" height="18" rx="4" fill="#2E1C0A" stroke="#D97706" stroke-width="1.5" />
        <!-- 6 Screw Terminal Pins -->
        <rect x="-85" y="-12" width="12" height="14" rx="2" fill="url(#pinGrad)" stroke="#F59E0B" stroke-width="1" />
        <rect x="-55" y="-12" width="12" height="14" rx="2" fill="url(#pinGrad)" stroke="#F59E0B" stroke-width="1" />
        <rect x="-25" y="-12" width="12" height="14" rx="2" fill="url(#pinGrad)" stroke="#F59E0B" stroke-width="1" />
        <rect x="13" y="-12" width="12" height="14" rx="2" fill="url(#pinGrad)" stroke="#F59E0B" stroke-width="1" />
        <rect x="43" y="-12" width="12" height="14" rx="2" fill="url(#pinGrad)" stroke="#F59E0B" stroke-width="1" />
        <rect x="73" y="-12" width="12" height="14" rx="2" fill="url(#pinGrad)" stroke="#F59E0B" stroke-width="1" />
        <!-- Wire hints entering pins -->
        <line x1="-79" y1="-20" x2="-79" y2="-12" stroke="#F59E0B" stroke-width="2" />
        <line x1="-49" y1="-20" x2="-49" y2="-12" stroke="#34D399" stroke-width="2" />
        <line x1="-19" y1="-20" x2="-19" y2="-12" stroke="#38BDF8" stroke-width="2" />
        <line x1="19" y1="-20" x2="19" y2="-12" stroke="#F59E0B" stroke-width="2" />
        <line x1="49" y1="-20" x2="49" y2="-12" stroke="#34D399" stroke-width="2" />
        <line x1="79" y1="-20" x2="79" y2="-12" stroke="#38BDF8" stroke-width="2" />
      </g>

      <!-- Main Heavy Metal Enclosure -->
      <rect x="-120" y="-76" width="240" height="154" rx="16" fill="url(#rtuGrad)" stroke="#F59E0B" stroke-width="3" />

      <!-- RTU Front Panel Divider -->
      <line x1="-120" y1="-28" x2="120" y2="-28" stroke="#334155" stroke-width="2" />

      <!-- Top Header Row: Status & Port -->
      <!-- Green Power/Run Indicator LED with Glow -->
      <circle cx="-96" cy="-52" r="6" fill="#10B981" filter="url(#glowGreen)" />
      <circle cx="-96" cy="-52" r="3" fill="#ECFDF5" />
      <text x="-84" y="-48.5" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" font-weight="800" fill="#34D399" letter-spacing="1">RUN</text>

      <!-- Port 2404 Badge -->
      <rect x="24" y="-62" width="76" height="20" rx="6" fill="#022C22" stroke="#10B981" stroke-width="1.2" />
      <text x="62" y="-48.5" font-family="monospace" font-size="11" font-weight="700" fill="#34D399" letter-spacing="1" text-anchor="middle">TCP:2404</text>

      <!-- Center Oscilloscope Screen (Spontaneous Signal & Sampling Wave) -->
      <rect x="-98" y="-16" width="196" height="74" rx="10" fill="url(#scopeGrad)" stroke="#059669" stroke-width="2" />
      <!-- Grid Lines Inside Scope -->
      <line x1="-98" y1="21" x2="98" y2="21" stroke="#064E3B" stroke-width="1" stroke-dasharray="4 4" />
      <line x1="0" y1="-16" x2="0" y2="58" stroke="#064E3B" stroke-width="1" stroke-dasharray="4 4" />

      <!-- 50Hz frequency tag inside scope -->
      <text x="86" y="-3" font-family="monospace" font-size="9" font-weight="700" fill="#059669" text-anchor="end">50Hz</text>

      <!-- Spontaneous Waveform (Sensor Sampling + Breaker Pulse) -->
      <path d="M -86 21 L -56 21 L -46 -2 L -32 44 L -18 -8 L -6 21 L 10 21 L 22 2 L 36 36 L 50 10 L 60 21 L 86 21" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGreen)" />

      <!-- Lower Chassis Screws -->
      <circle cx="-106" cy="64" r="3.5" fill="#475569" />
      <circle cx="106" cy="64" r="3.5" fill="#475569" />
    </g>
  </g>

  <!-- Typography & Subtitle Branding -->
  <g transform="translate(256, 436)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#F8FAFC" letter-spacing="8" text-anchor="middle">SLAVE</text>
    <!-- Subtitle Badge -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" letter-spacing="4" text-anchor="middle">SERVER · RTU SIMULATOR</text>
  </g>
</svg>