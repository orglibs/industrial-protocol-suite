name: Build and Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Build Windows Desktop Apps (Inno Setup Installer .exe & Portable .zip)
  # ============================================================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Determine Version
        id: version
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          TAG="${RAW_TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "raw_tag=${RAW_TAG}" >> $GITHUB_OUTPUT

      - name: Build All 6 Windows Desktop Applications
        shell: pwsh
        run: |
          $projects = @('iec104_server', 'iec104_client', 'iec61850_server', 'iec61850_client', 'modbus_slave', 'modbus_master')
          foreach ($p in $projects) {
            Write-Host "================== Building Windows: $p =================="
            Push-Location $p
            flutter pub get
            flutter build windows --release --no-tree-shake-icons
            Pop-Location
          }

      - name: Package Windows Installers & Archives
        shell: pwsh
        run: |
          .github/scripts/package-windows.ps1 -Version "${{ steps.version.outputs.tag }}" -OutputDir "dist-windows"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================================
  # 2. Build macOS Desktop Apps (.dmg Drag-to-Install Images)
  # ============================================================================
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Determine Version
        id: version
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          TAG="${RAW_TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "raw_tag=${RAW_TAG}" >> $GITHUB_OUTPUT

      - name: Build All 6 macOS Desktop Applications
        shell: bash
        run: |
          projects=("iec104_server" "iec104_client" "iec61850_server" "iec61850_client" "modbus_slave" "modbus_master")
          for p in "${projects[@]}"; do
            echo "================== Building macOS: $p =================="
            (cd "$p" && flutter pub get && flutter build macos --release --no-tree-shake-icons)
          done

      - name: Package macOS DMGs
        shell: bash
        run: |
          OUTPUT_DIR="dist-macos" .github/scripts/package-macos.sh "${{ steps.version.outputs.tag }}"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist-macos/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================================
  # 3. Build Linux x64 Desktop Apps (.deb Installer & Portable .tar.gz)
  # ============================================================================
  build-linux-x64:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Determine Version
        id: version
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          TAG="${RAW_TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "raw_tag=${RAW_TAG}" >> $GITHUB_OUTPUT

      - name: Build All 6 Linux Desktop Applications
        shell: bash
        run: |
          projects=("iec104_server" "iec104_client" "iec61850_server" "iec61850_client" "modbus_slave" "modbus_master")
          for p in "${projects[@]}"; do
            echo "================== Building Linux: $p =================="
            (cd "$p" && flutter pub get && flutter build linux --release --no-tree-shake-icons)
          done

      - name: Package Linux .deb and .tar.gz
        shell: bash
        run: |
          OUTPUT_DIR="dist-linux-x64" .github/scripts/package-linux.sh "${{ steps.version.outputs.tag }}"

      - name: Upload Linux x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-artifacts
          path: dist-linux-x64/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================================
  # 4. Build Linux ARM64 Desktop Apps (Multi-Arch .deb & .tar.gz)
  # ============================================================================
  build-linux-arm64:
    name: Build Linux (ARM64)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true # Safe fallback if repository is private without larger ARM runners enabled
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev git curl

      - name: Setup Flutter via Git (Native ARM64 Bootstrap)
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Enable Linux Desktop & Pre-cache
        run: |
          flutter config --enable-linux-desktop
          flutter precache --linux

      - name: Determine Version
        id: version
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          TAG="${RAW_TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "raw_tag=${RAW_TAG}" >> $GITHUB_OUTPUT

      - name: Build All 6 Linux ARM64 Applications
        shell: bash
        run: |
          projects=("iec104_server" "iec104_client" "iec61850_server" "iec61850_client" "modbus_slave" "modbus_master")
          for p in "${projects[@]}"; do
            echo "================== Building Linux ARM64: $p =================="
            (cd "$p" && flutter pub get && flutter build linux --release --no-tree-shake-icons)
          done

      - name: Package Linux ARM64 .deb and .tar.gz
        shell: bash
        run: |
          OUTPUT_DIR="dist-linux-arm64" .github/scripts/package-linux.sh "${{ steps.version.outputs.tag }}"

      - name: Upload Linux ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: dist-linux-arm64/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================================
  # 5. Publish to GitHub Releases (Collect all artifacts & generate Release)
  # ============================================================================
  publish-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux-x64.result == 'success')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: rel_info
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          TAG="${RAW_TAG#v}"
          if [[ "$RAW_TAG" != v* ]]; then
            RELEASE_TAG="v${TAG}"
          else
            RELEASE_TAG="${RAW_TAG}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-artifacts'
          path: dist
          merge-multiple: true

      - name: Generate Checksums & Release Notes
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt || true
          ls -lh
          cd ..

          cat << 'EOF' > release_body.md
          ## 📦 Industrial Protocol Simulation Suite Release (${{ steps.rel_info.outputs.release_tag }})

          A modern, cross-platform industrial and power automation protocol simulation suite developed purely in Flutter & Dart. It comprehensively covers IEC 60870-5-104, IEC 61850, and Modbus across 6 full-featured client and server desktop applications.

          ### 🚀 Download & Installation Guide

          #### 🪟 Windows (x64)
          * **Setup Installer**: Download the corresponding `*-setup.exe` and double-click to run the setup wizard (automatically creates desktop shortcuts, start menu entries, and uninstaller).
          * **Portable Archive**: Download the corresponding `*-windows-x64.zip`, extract, and launch directly.

          #### 🍎 macOS (Apple Silicon & Intel)
          * Download the corresponding `*-macos.dmg` image, double-click to open, and drag the application into the `Applications` folder.

          #### 🐧 Linux (x64 / amd64 & ARM64 / aarch64)
          * **Debian / Ubuntu / Linux Mint**: Download the `.deb` package matching your architecture, install via software center or run in terminal:
            ```bash
            sudo apt install ./<package_name>_<version>_linux_<arch>.deb
            ```
            Once installed, launch it directly from the system application launcher.
          * **Generic Linux Distributions**: Download the standalone `*.tar.gz` archive, extract, and execute `bundle/<app_name>`.

          ---

          ### 📋 Release Artifacts Matrix

          | Subsystem | Protocol Role | Windows Setup / Portable (.zip) | macOS Image (.dmg) | Linux DEB (x64 / ARM64) |
          | :--- | :--- | :--- | :--- | :--- |
          | **IEC 104 Server** | Server / Controlled Station (RTU) | `iec104_server-*-setup.exe` / `.zip` | `iec104_server-*-macos.dmg` | `iec104_server_*_amd64.deb` / `arm64.deb` |
          | **IEC 104 Client** | Client / Controlling Station (Master) | `iec104_client-*-setup.exe` / `.zip` | `iec104_client-*-macos.dmg` | `iec104_client_*_amd64.deb` / `arm64.deb` |
          | **IEC 61850 Server** | MMS & GOOSE Server / IED | `iec61850_server-*-setup.exe` / `.zip` | `iec61850_server-*-macos.dmg` | `iec61850_server_*_amd64.deb` / `arm64.deb` |
          | **IEC 61850 Client** | MMS & GOOSE Client / SCADA | `iec61850_client-*-setup.exe` / `.zip` | `iec61850_client-*-macos.dmg` | `iec61850_client_*_amd64.deb` / `arm64.deb` |
          | **Modbus Slave** | Slave / Server (RTU / TCP / UDP) | `modbus_slave-*-setup.exe` / `.zip` | `modbus_slave-*-macos.dmg` | `modbus_slave_*_amd64.deb` / `arm64.deb` |
          | **Modbus Master** | Master / Client (RTU / TCP / UDP) | `modbus_master-*-setup.exe` / `.zip` | `modbus_master-*-macos.dmg` | `modbus_master_*_amd64.deb` / `arm64.deb` |

          SHA-256 checksums for all release assets are available in the attached `SHA256SUMS.txt`.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_info.outputs.release_tag }}
          name: "Release ${{ steps.rel_info.outputs.release_tag }}"
          body_path: release_body.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
