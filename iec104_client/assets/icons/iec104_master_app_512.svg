<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Industrial Dark Slate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090F1C" />
      <stop offset="50%" stop-color="#0E172A" />
      <stop offset="100%" stop-color="#060B14" />
    </linearGradient>

    <!-- Radial Ambient Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Squircle Bezel Chamfer Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.55" />
    </linearGradient>

    <!-- Enlarged Abbreviation Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="55%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Role Badge Background Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.14" />
    </linearGradient>

    <!-- Luminous Drop Shadow -->
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0284C7" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="116" fill="url(#spotlight)" />

  <!-- Outer Bezel Inset Border -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Top Protocol Context Pill Badge -->
  <g transform="translate(256, 66)">
    <rect x="-84" y="-13" width="168" height="26" rx="13" fill="#0B1017" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.45" />
    <circle cx="-62" cy="0" r="3.5" fill="#38BDF8" />
    <text x="6" y="4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#BAE6FD" letter-spacing="1.5" text-anchor="middle">IEC 60870-5-104</text>
  </g>

  <!-- Upper-Center Emblem: Redesigned UI Icon Vector Motif -->
  <g transform="translate(256, 172)" filter="url(#heroGlow)">

    <!-- SCADA Workstation Monitor -->
    <rect x="-62" y="-36" width="124" height="76" rx="12" fill="#0C1B2F" stroke="#38BDF8" stroke-width="4.5" />
    <!-- Stand Base & Column -->
    <line x1="-28" y1="52" x2="28" y2="52" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />
    <line x1="0" y1="40" x2="0" y2="52" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />
    <!-- Interrogation Center Beacon -->
    <circle cx="0" cy="14" r="5" fill="#38BDF8" />
    <!-- Interrogation Query Waves Inside Screen -->
    <path d="M -22 -6 A 28 28 0 0 1 22 -6" fill="none" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round" />
    <path d="M -36 -18 A 45 45 0 0 1 36 -18" fill="none" stroke="#BAE6FD" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Center Hero: Magnified Protocol Abbreviation -->
  <g transform="translate(256, 350)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="122" font-weight="900" fill="url(#textGrad)" letter-spacing="4" text-anchor="middle" filter="url(#heroGlow)">104</text>
  </g>

  <!-- Bottom Role Capsule Badge: SERVER / CLIENT / SLAVE / MASTER -->
  <g transform="translate(256, 434)">
    <rect x="-105" y="-21" width="210" height="42" rx="21" fill="url(#badgeGrad)" stroke="#38BDF8" stroke-width="1.8" stroke-opacity="0.75" />
    <!-- Role Status Dot with Pulse -->
    <circle cx="-76" cy="0" r="5" fill="#38BDF8" />
    <circle cx="-76" cy="0" r="2.5" fill="#FFFFFF" />
    <!-- Primary Role Title -->
    <text x="6" y="5.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">CLIENT</text>
    <!-- Secondary Descriptive Subtitle -->
    <text x="0" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#94A3B8" letter-spacing="2" text-anchor="middle">MASTER · DISPATCH CONSOLE</text>
  </g>
</svg>
