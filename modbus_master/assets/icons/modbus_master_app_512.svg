<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Indigo & Industrial Carbon) -->
    <linearGradient id="bgModbus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0B25" />
      <stop offset="45%" stop-color="#191542" />
      <stop offset="100%" stop-color="#070614" />
    </linearGradient>

    <!-- Center Glow (Indigo & Cyan) -->
    <radialGradient id="centerGlowModbus" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#4338CA" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0E0B25" stop-opacity="0" />
    </radialGradient>

    <!-- Indigo Accent Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Master Controller Chassis -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#16133D" />
      <stop offset="100%" stop-color="#0F0D2B" />
    </linearGradient>

    <!-- Screen / Matrix Gradient -->
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08081B" />
      <stop offset="100%" stop-color="#03030C" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadowModbus" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#6366F1" flood-opacity="0.38" />
    </filter>

    <filter id="glowIndigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgModbus)" />

  <!-- Industrial Bus Network Grid Lines -->
  <g stroke="#818CF8" stroke-width="1" stroke-opacity="0.07">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" stroke-opacity="0.14" stroke-dasharray="6 4" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" stroke-opacity="0.14" stroke-dasharray="6 4" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Ambient Light Sphere -->
  <rect width="512" height="512" rx="116" fill="url(#centerGlowModbus)" />

  <!-- Outer Squircle Bezel Border -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#indigoGrad)" stroke-width="3" stroke-opacity="0.45" />

  <!-- Protocol Header Badge -->
  <g transform="translate(256, 68)">
    <rect x="-92" y="-14" width="184" height="28" rx="14" fill="#1C1844" stroke="#6366F1" stroke-width="1.5" />
    <circle cx="-70" cy="0" r="4" fill="#A5B4FC" />
    <text x="8" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C7D2FE" letter-spacing="2" text-anchor="middle">MODBUS TCP / RTU</text>
  </g>

  <!-- Main Illustration Group -->
  <g filter="url(#shadowModbus)" transform="translate(0, -6)">
    <!-- Top Bus Header Bar (RS-485 / Ethernet Master Trunk) -->
    <g stroke-linecap="round">
      <!-- Master Bus Line -->
      <line x1="100" y1="140" x2="412" y2="140" stroke="#6366F1" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />
      <line x1="140" y1="140" x2="372" y2="140" stroke="#818CF8" stroke-width="4" />
      <!-- Polling Drops to Distributed Slaves -->
      <line x1="160" y1="140" x2="160" y2="165" stroke="#F59E0B" stroke-width="2.5" />
      <circle cx="160" cy="168" r="4" fill="#FBBF24" />
      <line x1="352" y1="140" x2="352" y2="165" stroke="#10B981" stroke-width="2.5" />
      <circle cx="352" cy="168" r="4" fill="#34D399" />
    </g>

    <!-- Master Central Terminal / Controller Unit -->
    <g transform="translate(256, 274)">
      <!-- Master Enclosure (Heavy Industrial Housing) -->
      <rect x="-124" y="-95" width="248" height="175" rx="18" fill="url(#chassisGrad)" stroke="#6366F1" stroke-width="3" />

      <!-- Top Terminal Header with Screw Pins -->
      <g transform="translate(0, -107)">
        <rect x="-106" y="0" width="212" height="16" rx="4" fill="#161338" stroke="#4F46E5" stroke-width="1.5" />
        <!-- 6 Bus Pins (Tx+, Tx-, Rx+, Rx-, GND, PE) -->
        <rect x="-90" y="-8" width="10" height="10" rx="2" fill="#F59E0B" />
        <rect x="-60" y="-8" width="10" height="10" rx="2" fill="#F59E0B" />
        <rect x="-15" y="-8" width="10" height="10" rx="2" fill="#38BDF8" />
        <rect x="15" y="-8" width="10" height="10" rx="2" fill="#38BDF8" />
        <rect x="60" y="-8" width="10" height="10" rx="2" fill="#818CF8" />
        <rect x="85" y="-8" width="10" height="10" rx="2" fill="#818CF8" />
      </g>

      <!-- Panel Header: Status LEDs & Port Badge -->
      <line x1="-124" y1="-55" x2="124" y2="-55" stroke="#2D2866" stroke-width="2" />
      
      <!-- TX / RX Indicator LEDs -->
      <circle cx="-100" cy="-74" r="5" fill="#10B981" />
      <text x="-90" y="-70" font-family="monospace" font-size="10" font-weight="800" fill="#34D399">TX</text>
      <circle cx="-56" cy="-74" r="5" fill="#F59E0B" />
      <text x="-46" y="-70" font-family="monospace" font-size="10" font-weight="800" fill="#FBBF24">RX</text>

      <!-- Port 502 Badge -->
      <rect x="30" y="-84" width="76" height="20" rx="6" fill="#171242" stroke="#818CF8" stroke-width="1.2" />
      <text x="68" y="-70.5" font-family="monospace" font-size="11" font-weight="700" fill="#C7D2FE" letter-spacing="1" text-anchor="middle">PORT:502</text>

      <!-- Central Display Area: The Iconic Modbus "M" + 4-Zone Registers -->
      <rect x="-106" y="-42" width="212" height="108" rx="10" fill="url(#matrixGrad)" stroke="#4338CA" stroke-width="2" />

      <!-- Register Grid Rows Background -->
      <line x1="-106" y1="-7" x2="106" y2="-7" stroke="#1E1B4B" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="-106" y1="28" x2="106" y2="28" stroke="#1E1B4B" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="0" y1="-42" x2="0" y2="66" stroke="#1E1B4B" stroke-width="1" stroke-dasharray="3 3" />

      <!-- 4-Zone Register Tags (Cleanly spaced) -->
      <text x="-88" y="-27" font-family="monospace" font-size="9" font-weight="700" fill="#6366F1" opacity="0.8">0x COILS</text>
      <text x="18" y="-27" font-family="monospace" font-size="9" font-weight="700" fill="#6366F1" opacity="0.8">1x DISCRETE</text>
      <text x="-88" y="52" font-family="monospace" font-size="9" font-weight="700" fill="#6366F1" opacity="0.8">3x INPUT</text>
      <text x="18" y="52" font-family="monospace" font-size="9" font-weight="700" fill="#6366F1" opacity="0.8">4x HOLDING</text>

      <!-- Central Glowing Modbus "M" Dynamic Waveform (Master Polling Pulse) -->
      <path d="M -72 26 L -46 -14 L -18 14 L 0 -2 L 18 14 L 46 -14 L 72 26" fill="none" stroke="#818CF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowIndigo)" />
      
      <!-- Polling Active Node Highlights -->
      <circle cx="-46" cy="-14" r="4" fill="#FFFFFF" />
      <circle cx="0" cy="-2" r="4.5" fill="#FBBF24" />
      <circle cx="46" cy="-14" r="4" fill="#FFFFFF" />

      <!-- Bottom Chassis Screws -->
      <circle cx="-110" cy="68" r="3.5" fill="#4338CA" />
      <circle cx="110" cy="68" r="3.5" fill="#4338CA" />
    </g>
  </g>

  <!-- Typography & Subtitle Branding -->
  <g transform="translate(256, 436)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#F8FAFC" letter-spacing="8" text-anchor="middle">MODBUS</text>
    <!-- Subtitle Badge -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#818CF8" letter-spacing="4" text-anchor="middle">MASTER · CLIENT EMULATOR</text>
  </g>
</svg>