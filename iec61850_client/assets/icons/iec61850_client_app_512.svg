<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Industrial Dark Slate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E20" />
      <stop offset="50%" stop-color="#101A38" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Radial Ambient Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Squircle Bezel Chamfer Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.55" />
    </linearGradient>

    <!-- Enlarged Abbreviation Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="55%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Role Badge Background Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.14" />
    </linearGradient>

    <!-- Luminous Drop Shadow -->
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#6366F1" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="116" fill="url(#spotlight)" />

  <!-- Outer Bezel Inset Border -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Top Protocol Context Pill Badge -->
  <g transform="translate(256, 66)">
    <rect x="-84" y="-13" width="168" height="26" rx="13" fill="#0B1017" stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.45" />
    <circle cx="-62" cy="0" r="3.5" fill="#818CF8" />
    <text x="6" y="4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#C7D2FE" letter-spacing="1.5" text-anchor="middle">IEC 61850</text>
  </g>

  <!-- Upper-Center Emblem: Redesigned UI Icon Vector Motif -->
  <g transform="translate(256, 172)" filter="url(#heroGlow)">

    <!-- SCADA Engineering Station Screen -->
    <rect x="-62" y="-36" width="124" height="76" rx="12" fill="#121A3B" stroke="#818CF8" stroke-width="4.5" />
    <line x1="-28" y1="52" x2="28" y2="52" stroke="#818CF8" stroke-width="4.5" stroke-linecap="round" />
    <line x1="0" y1="40" x2="0" y2="52" stroke="#818CF8" stroke-width="4.5" stroke-linecap="round" />
    <!-- SCL Hierarchy Tree Nodes -->
    <path d="M -34 -14 L -34 22 L -14 22" fill="none" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -34 4 L -14 4" fill="none" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="12" cy="-14" r="6" fill="#06B6D4" />
    <circle cx="12" cy="4" r="6" fill="#A855F7" />
    <circle cx="12" cy="22" r="6" fill="#38BDF8" />
    <line x1="22" y1="-14" x2="38" y2="-14" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round" />
    <line x1="22" y1="4" x2="38" y2="4" stroke="#A855F7" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Center Hero: Magnified Protocol Abbreviation -->
  <g transform="translate(256, 350)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="900" fill="url(#textGrad)" letter-spacing="3" text-anchor="middle" filter="url(#heroGlow)">61850</text>
  </g>

  <!-- Bottom Role Capsule Badge: SERVER / CLIENT / SLAVE / MASTER -->
  <g transform="translate(256, 434)">
    <rect x="-105" y="-21" width="210" height="42" rx="21" fill="url(#badgeGrad)" stroke="#818CF8" stroke-width="1.8" stroke-opacity="0.75" />
    <!-- Role Status Dot with Pulse -->
    <circle cx="-76" cy="0" r="5" fill="#818CF8" />
    <circle cx="-76" cy="0" r="2.5" fill="#FFFFFF" />
    <!-- Primary Role Title -->
    <text x="6" y="5.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">CLIENT</text>
    <!-- Secondary Descriptive Subtitle -->
    <text x="0" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#94A3B8" letter-spacing="2" text-anchor="middle">SCADA · MMS &amp; GOOSE CLIENT</text>
  </g>
</svg>
